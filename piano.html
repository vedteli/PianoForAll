<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Piano - PianoForAll</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/piano.css">
</head>
<body>
    
    <nav>
        <div class="navgiation-container">
            <div class="brand"> 
                <img class="brand-image" src="static/piano-logo.webp" alt="PianoForAll Logo">
            </div>

            <button class="menu-toggle" aria-label="Toggle menu" id="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="navigation" id="nav-menu">
                <ul class="navigation-options">
                    <li>
                        <a class="navigation-links" href="index.html#home">Home</a>
                    </li>
                    <li>
                        <a class="navigation-links" href="index.html#courses">Courses</a>
                    </li>
                    <li>
                        <a class="navigation-links" href="index.html#about">About Us</a>
                    </li>
                    <li>
                        <a class="navigation-links" href="piano.html">Virtual Piano</a>
                    </li>
                    <li>
                        <a class="navigation-links" href="index.html#contact">Contact</a>
                    </li>
                </ul>
            </div>

            <div class="profile">
                <img class="profile-image" src="static/avatar.svg" alt="User Profile">            
            </div>
        </div>
    </nav>

    <main class="piano-container">
        <div class="piano-wrapper">
            
            <!-- Header Section -->
            <section class="piano-header">
                <h1>Virtual Piano</h1>
                <p>Click keys or use your keyboard to play. Learn scales and improve your skills.</p>
            </section>

            <!-- Control Panel -->
            <section class="control-panel">
                <div class="control-group">
                    <label for="volume-slider">Volume</label>
                    <input type="range" id="volume-slider" min="0" max="100" value="50" class="volume-slider">
                    <span id="volume-display">50%</span>
                </div>
            </section>

            <!-- Piano Keyboard -->
            <section class="piano-section">
                <div class="piano-keyboard" id="piano-keyboard"></div>
            </section>

            <!-- Scales Panel -->
            <section class="scales-section">
                <h2>Scales</h2>
                <div class="scales-controls">
                    <div class="scale-buttons" id="scale-buttons"></div>
                </div>

                <!-- Playback Controls -->
                <div class="playback-controls">
                    <button id="play-scale-btn" class="control-btn primary-btn" aria-label="Play scale">
                        <span class="btn-icon">▶</span> Play Scale
                    </button>
                    <button id="stop-scale-btn" class="control-btn secondary-btn" aria-label="Stop playback" disabled>
                        <span class="btn-icon">⏹</span> Stop
                    </button>
                    <button id="replay-scale-btn" class="control-btn secondary-btn" aria-label="Replay scale">
                        <span class="btn-icon">🔁</span> Replay
                    </button>
                </div>

                <!-- Playback Speed -->
                <div class="playback-speed">
                    <label for="speed-selector">Playback Speed</label>
                    <select id="speed-selector" class="speed-select">
                        <option value="slow">Slow</option>
                        <option value="normal" selected>Normal</option>
                        <option value="fast">Fast</option>
                    </select>
                </div>

                <!-- Current Scale Display -->
                <div class="current-scale" id="current-scale">
                    Select a scale to play
                </div>
            </section>

            <!-- Keyboard Legend -->
            <section class="legend-section">
                <h2>Keyboard Shortcuts</h2>
                <div class="legend-grid">
                    <div class="legend-item">
                        <kbd>A</kbd> - C
                    </div>
                    <div class="legend-item">
                        <kbd>W</kbd> - C#
                    </div>
                    <div class="legend-item">
                        <kbd>S</kbd> - D
                    </div>
                    <div class="legend-item">
                        <kbd>E</kbd> - D#
                    </div>
                    <div class="legend-item">
                        <kbd>D</kbd> - E
                    </div>
                    <div class="legend-item">
                        <kbd>F</kbd> - F
                    </div>
                    <div class="legend-item">
                        <kbd>T</kbd> - F#
                    </div>
                    <div class="legend-item">
                        <kbd>G</kbd> - G
                    </div>
                    <div class="legend-item">
                        <kbd>Y</kbd> - G#
                    </div>
                    <div class="legend-item">
                        <kbd>H</kbd> - A
                    </div>
                    <div class="legend-item">
                        <kbd>U</kbd> - A#
                    </div>
                    <div class="legend-item">
                        <kbd>J</kbd> - B
                    </div>
                </div>
            </section>

        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/piano.js"></script>
</body>
</html>
